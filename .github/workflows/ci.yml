name: Java CI & Test Suite

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java Source Files
        run: javac *.java

      - name: Run Automated Test Suite (10 Test Cases)
        run: java TestRunner

      - name: Run CLI Sparse Matrix Addition
        run: java SparseMatrix matrix1.txt matrix2.txt
